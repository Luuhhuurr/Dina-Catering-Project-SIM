{{define "biaya_daftar"}}
<div id="halaman-biaya">
  {{if .Daftar}}
  <div class="tabel-bungkus">
    <table>
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Kategori</th>
          <th>Deskripsi</th>
          <th class="angka">Nominal</th>
        </tr>
      </thead>
      <tbody>
        {{range .Daftar}}
        <tr>
          <td>{{ tanggal .Tanggal }}</td>
          <td>{{ .Kategori }}</td>
          <td>{{ .Deskripsi }}</td>
          <td class="angka">{{ rupiah .Jumlah }}</td>
        </tr>
        {{end}}
      </tbody>
      <tfoot>
        <tr>
          <th colspan="3">Total</th>
          <th class="angka">{{ rupiah .Total }}</th>
        </tr>
      </tfoot>
    </table>
  </div>
  {{else}}
  <div class="kosong">
    <div class="ikon-kosong"><svg class="i i-lg"><use href="#i-kosong"></use></svg></div>
    Belum ada biaya tercatat pada periode ini.
  </div>
  {{end}}
</div>
{{end}}
